[project]
name = "siteadmin-agent"
version = "0.1.0"
description = "Outbound-only Linux agent for uHive Site Admin"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<46"]

[project.scripts]
siteadmin = "siteadmin.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
lint = ["ruff>=0.6,<1"]

[tool.ruff]
target-version = "py310"
line-length = 120
